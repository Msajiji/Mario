<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Rio: Science Quest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1e3a8a;
            color: white;
            overflow: hidden;
            touch-action: none; /* Prevent zooming on touch */
        }
        .pixel-font { font-family: 'Press Start 2P', cursive; }
        #gameCanvas {
            image-rendering: pixelated;
            background: linear-gradient(to bottom, #87CEEB, #E0F6FF);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .modal-bg {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
        }
        
        /* Custom Scrollbar for Leaderboard */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #374151; }
        ::-webkit-scrollbar-thumb { background: #60a5fa; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3b82f6; }
    </style>
</head>
<body class="flex flex-col md:flex-row h-screen w-screen m-0 p-0">

    <!-- Game Area -->
    <div class="relative flex-1 flex flex-col items-center justify-center bg-blue-900 p-2 md:p-4">
        
        <!-- Game HUD -->

                </button>
            </div>

            </button>
        </div>

        <!-- Start Screen Modal -->
        <div id="startScreen" class="absolute inset-0 modal-bg flex items-center justify-center z-50 rounded-lg border-4 border-transparent">

            </div>
        </div>

        <!-- Quiz Modal -->

            <div class="bg-white text-gray-900 p-6 md:p-8 rounded-2xl shadow-2xl max-w-2xl w-full mx-4">

                    <h2 class="text-xl font-bold text-blue-600">SCIENCE QUIZ LEVEL <span id="quizLevelDisplay">1</span></h2>
                    <span class="bg-yellow-400 text-yellow-900 px-3 py-1 rounded-full font-bold text-sm">Question <span id="questionCounter">1</span>/3</span>
                </div>
                <p id="questionText" class="text-lg md:text-xl font-semibold mb-6 min-h-[60px]"></p>
                <div id="optionsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Options injected via JS -->

            </div>
        </div>

        <!-- Game Over Modal -->

            <div class="bg-white text-gray-900 p-8 rounded-2xl shadow-2xl text-center max-w-md w-full mx-4">
                <h1 class="pixel-font text-3xl text-red-600 mb-4">GAME OVER!</h1>
                <p class="text-lg font-bold mb-2">Congratulations, <span id="finalName" class="text-blue-600"></span>!</p>
                <p class="text-gray-600 mb-6">Your Total Score:</p>
                <div class="text-5xl pixel-font text-yellow-500 mb-8" id="finalScore">0</div>
                <button id="restartBtn" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-6 rounded-lg text-lg transition-transform transform hover:scale-105 pixel-font text-sm">PLAY AGAIN</button>
            </div>
        </div>
    </div>

    <!-- Leaderboard Sidebar -->
    <div class="w-full md:w-80 bg-gray-900 border-t-4 md:border-t-0 md:border-l-4 border-blue-500 flex flex-col h-64 md:h-full z-20 shadow-2xl">
        <div class="p-4 bg-gray-800 border-b-2 border-gray-700">
            <h2 class="text-xl font-bold text-white pixel-font text-center text-sm md:text-base">LEADERBOARD</h2>
            <p class="text-xs text-gray-400 text-center mt-1">Player History</p>
        </div>
        <div class="flex-1 overflow-y-auto p-4">
            <ul id="leaderboardList" class="space-y-3">
                <!-- Leaderboard items injected via JS -->

            </ul>

    </div>

<script>

// --- 2. GAME VARIABLES & STATE ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let gameState = 'START'; // START, PLAYING, QUIZ, GAMEOVER
let playerName = "";
let score = 0;
let currentLevel = 1;
const maxLevel = 5;
let animationId;
let leaderboardData = [];

let isGoalReached = false;
let currentQuizQuestions = [];
let currentQuestionIndex = 0;

const GRAVITY = 0.5;
const FRICTION = 0.8;
const MAX_SPEED = 5;

const keys = {
    ArrowLeft: false, ArrowRight: false, ArrowUp: false,
    a: false, d: false, w: false, Space: false
};

// --- 3. HELPER GRAPHICS FUNCTION ---
function drawRoundRect(ctx, x, y, w, h, r, fill, stroke, shadowY = 0) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
    
    if (fill) {
        ctx.fillStyle = fill;
        ctx.fill();
    }
    
    // Bottom shadow for 3D effect
    if (shadowY > 0 && fill) {
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.beginPath();
        ctx.moveTo(x + r, y + h - shadowY);
        ctx.lineTo(x + w - r, y + h - shadowY);
        ctx.quadraticCurveTo(x + w, y + h - shadowY, x + w, y + h - shadowY + (r/2));
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + h - shadowY + (r/2));
        ctx.closePath();
        ctx.fill();
    }

    if (stroke) {
        ctx.strokeStyle = stroke;
        ctx.lineWidth = 3;
        ctx.stroke();
    }
}

// --- 4. GAME ENTITIES ---
class Player {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.width = 32;
        this.height = 32;
        this.vx = 0;
        this.vy = 0;
        this.speed = 2.0;
        this.jumpPower = -12;
        this.grounded = false;
        
        // Visuals
        this.trail = [];
    }

    update() {
        if ((keys.ArrowLeft || keys.a) && !isGoalReached) {
            this.vx -= this.speed;
        }
        if ((keys.ArrowRight || keys.d) && !isGoalReached) {
            this.vx += this.speed;
        }

        if ((keys.ArrowUp || keys.w || keys.Space) && this.grounded && !isGoalReached) {
            this.vy = this.jumpPower;
            this.grounded = false;
        }

        this.vx *= FRICTION;
        this.vy += GRAVITY;

        if (this.vx > MAX_SPEED) this.vx = MAX_SPEED;
        if (this.vx < -MAX_SPEED) this.vx = -MAX_SPEED;

        this.x += this.vx;
        this.y += this.vy;

        // Trail logic
        this.trail.push({x: this.x + this.width/2, y: this.y + this.height/2});
        if (this.trail.length > 15) this.trail.shift();

        // Screen bounds
        if (this.x < 0) { this.x = 0; this.vx = 0; }
        if (this.x + this.width > canvas.width) { this.x = canvas.width - this.width; this.vx = 0; }
        if (this.y > canvas.height) {
            this.die();
        }
    }
    
    die() {
        this.x = 50;
        this.y = 100;
        this.vy = 0;
        this.trail = [];
        score = Math.max(0, score - 50);
        updateHUD();
    }

    draw(ctx) {
        const cx = this.x + this.width / 2;
        const cy = this.y + this.height / 2;
        
        let dir = this.vx >= 0 ? 1 : -1;
        if (this.vx === 0 && (keys.ArrowLeft || keys.a)) dir = -1;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(dir, 1); // Flip based on direction

        // Draw Future Scientist Character
        
        // Turban (White)
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-8, -20, 16, 8);
        ctx.fillStyle = '#e2e8f0'; // Turban folds shadow
        ctx.fillRect(-8, -16, 16, 2);

        // Face (Skin tone)
        ctx.fillStyle = '#f4c49e';
        ctx.fillRect(-6, -12, 12, 10);
        
        // Smile/Mouth
        ctx.fillStyle = '#991b1b';
        ctx.fillRect(4, -4, 3, 1);

        // Sci-fi Visor / Glasses (Translucent Cyan)
        ctx.fillStyle = 'rgba(6, 182, 212, 0.6)';
        ctx.fillRect(-7, -11, 15, 6);
        ctx.strokeStyle = '#67e8f9'; // Bright cyan edge
        ctx.lineWidth = 1;
        ctx.strokeRect(-7, -11, 15, 6);
        // Visor glow reflection
        ctx.fillStyle = '#cffafe';
        ctx.fillRect(-5, -10, 4, 2);

        // Inner Vest (Dark Slate)
        ctx.fillStyle = '#334155'; 
        ctx.fillRect(-4, -2, 8, 10);
        // Gold buttons on vest
        ctx.fillStyle = '#fbbf24';
        ctx.fillRect(0, 0, 2, 2);
        ctx.fillRect(0, 4, 2, 2);

        // Red Jacket (Outer)
        ctx.fillStyle = '#b91c1c'; // Dark red for back side
        ctx.fillRect(-7, -2, 3, 11);
        ctx.fillStyle = '#ef4444'; // Bright red for front side
        ctx.fillRect(3, -2, 4, 11);

        // Arms (Jacket sleeves)
        // Back Arm
        ctx.fillStyle = '#991b1b'; // Darker red
        ctx.fillRect(-10, -2, 4, 7);
        ctx.fillStyle = '#f4c49e'; // Hand
        ctx.fillRect(-10, 5, 4, 3);
        
        // Front Arm
        ctx.fillStyle = '#ef4444'; // Bright red
        ctx.fillRect(5, -2, 4, 7);
        // Sci-fi wristband/watch
        ctx.fillStyle = '#06b6d4'; 
        ctx.fillRect(5, 4, 4, 1);
        ctx.fillStyle = '#f4c49e'; // Hand
        ctx.fillRect(5, 5, 4, 3);

        // Pants (Dark Grey)
        ctx.fillStyle = '#1e293b'; 
        ctx.fillRect(-5, 8, 4, 6);
        ctx.fillRect(1, 8, 4, 6);
        
        // Shoes (Black/Darker Grey)
        ctx.fillStyle = '#0f172a'; 
        ctx.fillRect(-7, 14, 6, 3);
        ctx.fillRect(1, 14, 6, 3);

        ctx.restore();
    }
}

class Platform {
    constructor(x, y, w, h, isFloor = false) {
        this.x = x;
        this.y = y;
        this.width = w;
        this.height = h;
        this.isFloor = isFloor;
    }
    draw(ctx) {
        if (this.isFloor) {
            // Ground Dirt Base
            ctx.fillStyle = '#c27a24'; // Brown dirt
            ctx.fillRect(this.x, this.y, this.width, this.height);
            
            // Underground Grid Pattern (Classic Mario)
            ctx.strokeStyle = '#9c5a14';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for(let i=0; i<=this.width; i+=24) { ctx.moveTo(this.x+i, this.y+16); ctx.lineTo(this.x+i, this.y+this.height); }
            for(let i=16; i<=this.height; i+=24) { ctx.moveTo(this.x, this.y+i); ctx.lineTo(this.x+this.width, this.y+i); }
            ctx.stroke();

            // Grass Top
            ctx.fillStyle = '#4ade80'; // Bright Green
            ctx.fillRect(this.x, this.y, this.width, 16);
            ctx.fillStyle = '#22c55e'; // Darker Green bottom trim
            ctx.fillRect(this.x, this.y+12, this.width, 4);
            
            // Wavy grass details
            ctx.fillStyle = '#16a34a';
            for(let i=0; i<this.width; i+=12) {
                ctx.fillRect(this.x + i + 2, this.y + 4, 4, 4);
            }
        } else {
            // Floating Brick Blocks
            ctx.fillStyle = '#cc4a14'; // Brick red/orange
            ctx.fillRect(this.x, this.y, this.width, this.height);
            
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;
            ctx.strokeRect(this.x, this.y, this.width, this.height);
            
            // Brick lines
            ctx.beginPath();
            for(let i=0; i<this.width; i+=20) { ctx.moveTo(this.x+i, this.y); ctx.lineTo(this.x+i, this.y+this.height); }
            for(let i=0; i<this.height; i+=10) { ctx.moveTo(this.x, this.y+i); ctx.lineTo(this.x+this.width, this.y+i); }
            ctx.stroke();
            
            // Highlight on top edges for 3D effect
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.fillRect(this.x, this.y, this.width, 3);
        }
    }
}

class Spike {
    constructor(x, y, w, h) {
        this.x = x;
        this.y = y;
        this.width = w;
        this.height = h;
    }
    draw(ctx) {
        // Black Pit Background
        ctx.fillStyle = '#000000'; 
        ctx.fillRect(this.x, this.y, this.width, this.height);
        
        // Classic White Spikes
        ctx.fillStyle = '#ffffff'; 
        let spikeW = 20;
        let count = Math.floor(this.width / spikeW);
        let actualW = this.width / count;
        
        for(let i=0; i<count; i++) {
            let sx = this.x + (i * actualW);
            // Main spike
            ctx.beginPath();
            ctx.moveTo(sx, this.y + this.height);
            ctx.lineTo(sx + (actualW/2), this.y + 10);
            ctx.lineTo(sx + actualW, this.y + this.height);
            ctx.fill();
            
            // Spike shading (grey)
            ctx.fillStyle = '#cbd5e1';
            ctx.beginPath();
            ctx.moveTo(sx + (actualW/2), this.y + 10);
            ctx.lineTo(sx + actualW, this.y + this.height);
            ctx.lineTo(sx + (actualW/2), this.y + this.height);
            ctx.fill();
            ctx.fillStyle = '#ffffff'; // reset for next
        }
    }
}

class StartSign {
    constructor(x, y) {
        this.x = x;
        this.y = y;
    }
    draw(ctx) {
        // Classic wooden sign
        ctx.fillStyle = '#8b5a2b';
        ctx.fillRect(this.x + 20, this.y, 6, 40); // Stick
        
        // Board
        ctx.fillStyle = '#d2b48c';
        ctx.fillRect(this.x, this.y - 25, 46, 25);
        ctx.strokeStyle = '#5c4033';
        ctx.lineWidth = 3;
        ctx.strokeRect(this.x, this.y - 25, 46, 25);
        
        // Text
        ctx.fillStyle = '#000000';
        ctx.font = '7px "Press Start 2P"';
        ctx.fillText("START", this.x + 4, this.y - 10);
    }
}

class Coin {
    constructor(x, y, label="COIN") {
        this.x = x;
        this.y = y;
        this.width = 24;
        this.height = 32;
        this.collected = false;
        this.animOffset = 0;
        this.label = label;
    }
    draw(ctx) {
        if (this.collected) return;
        
        // 3D Spinning Effect
        let time = Date.now() / 200;
        let scaleX = Math.abs(Math.cos(time)); 
        this.animOffset = Math.sin(time) * 4;
        
        const cy = this.y + this.height/2 + this.animOffset;
        const cx = this.x + this.width/2;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(scaleX || 0.1, 1);

        // Gold Coin Outer
        ctx.fillStyle = '#facc15'; 
        ctx.beginPath();
        ctx.ellipse(0, 0, this.width/2, this.height/2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#ca8a04';
        ctx.stroke();
        
        // Inner Highlight
        ctx.fillStyle = '#fef08a';
        ctx.beginPath();
        ctx.ellipse(0, 0, this.width/4, this.height/2 - 4, 0, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.restore();
        
        // Label Text
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 2;
        ctx.font = '8px "Press Start 2P"';
        ctx.textAlign = 'center';
        ctx.strokeText(this.label, cx, cy - 22);
        ctx.fillText(this.label, cx, cy - 22);
        ctx.textAlign = 'left';
    }
}

class Goal {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.width = 40;
        this.height = 80;
    }
    draw(ctx) {
        // Flag pole base block (brown block)
        ctx.fillStyle = '#b45f06';
        ctx.fillRect(this.x - 4, this.y + this.height - 10, 16, 10);
        ctx.strokeStyle = 'black';
        ctx.strokeRect(this.x - 4, this.y + this.height - 10, 16, 10);

        // Flag pole
        ctx.fillStyle = '#d1d5db'; // Grey
        ctx.fillRect(this.x + 2, this.y - 10, 4, this.height + 10);
        ctx.strokeStyle = '#000';
        ctx.strokeRect(this.x + 2, this.y - 10, 4, this.height + 10);
        
        // Flag pole top ball
        ctx.fillStyle = '#22c55e'; // Green ball
        ctx.beginPath();
        ctx.arc(this.x + 4, this.y - 12, 8, 0, Math.PI*2);
        ctx.fill();
        ctx.stroke();
        
        // Green Flag
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(this.x + 6, this.y, 30, 20);
        ctx.strokeRect(this.x + 6, this.y, 30, 20);
        
        // Flag symbol (Star)
        ctx.fillStyle = '#22c55e';
        ctx.font = '12px Arial';
        ctx.fillText("★", this.x + 14, this.y + 15);

        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = 'black';
        ctx.lineWidth = 2;
        ctx.font = '8px "Press Start 2P"';
        ctx.strokeText("GOAL", this.x - 4, this.y - 25);
        ctx.fillText("GOAL", this.x - 4, this.y - 25);
    }
}

// --- 6. GAME ENGINE / LOGIC ---

function AABB(rect1, rect2) {
    return (
        rect1.x < rect2.x + rect2.width &&
        rect1.x + rect1.width > rect2.x &&
        rect1.y < rect2.y + rect2.height &&
        rect1.y + rect1.height > rect2.y
    );
}

function getCollisionDirection(r1, r2) {
    const vX = (r1.x + (r1.width / 2)) - (r2.x + (r2.width / 2));
    const vY = (r1.y + (r1.height / 2)) - (r2.y + (r2.height / 2));
    const hWidths = (r1.width / 2) + (r2.width / 2);
    const hHeights = (r1.height / 2) + (r2.height / 2);
    let colDir = null;

    if (Math.abs(vX) < hWidths && Math.abs(vY) < hHeights) {
        const oX = hWidths - Math.abs(vX);
        const oY = hHeights - Math.abs(vY);
        if (oX >= oY) {
            if (vY > 0) colDir = 'bottom';
            else colDir = 'top';
        } else {
            if (vX > 0) colDir = 'left';
            else colDir = 'right';
        }
    }
    return colDir;
}

function handleCollisions() {
    player.grounded = false;
    
    // Platforms
    for (let p of platforms) {
        const collision = getCollisionDirection(player, p);
        if (collision) {
            if (collision === 'top') {
                player.vy = 0;
                player.y = p.y - player.height;
                player.grounded = true;
            } else if (collision === 'bottom') {
                player.vy = 0;
                player.y = p.y + p.height;
            } else if (collision === 'left') {
                player.vx = 0;
                player.x = p.x + p.width;
            } else if (collision === 'right') {
                player.vx = 0;
                player.x = p.x - player.width;
            }
        }
    }

    // Spikes (Death)
    for (let s of spikes) {
        // give a little leniency hitbox for spikes
        const spikeHitbox = {x: s.x + 10, y: s.y + 20, width: s.width - 20, height: s.height - 20};
        if (AABB(player, spikeHitbox)) {
            player.die();
        }
    }

    // Coins
    for (let c of coins) {
        if (!c.collected && AABB(player, c)) {
            c.collected = true;
            score += 50;
            updateHUD();
        }
    }

    // Goal
    if (!isGoalReached && AABB(player, goal)) {
        isGoalReached = true;
        triggerQuiz();
    }
}

function gameLoop() {
    if (gameState === 'PLAYING') {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Draw background scenery
        drawBackground();

        player.update();
        handleCollisions();

        // Draw entities
        if(startSign) startSign.draw(ctx);
        for (let s of spikes) s.draw(ctx);
        for (let p of platforms) p.draw(ctx);
        for (let c of coins) c.draw(ctx);
        goal.draw(ctx);
        player.draw(ctx);
    }
    
    animationId = requestAnimationFrame(gameLoop);
}

function drawBackground() {
    // Sky Gradient
    let skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
    skyGradient.addColorStop(0, '#3b82f6'); // Rich Blue
    skyGradient.addColorStop(1, '#93c5fd'); // Light Blue
    ctx.fillStyle = skyGradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Fluffy Clouds (Classic Style)
    const drawCloud = (cx, cy, scale) => {
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(cx, cy, 20*scale, 0, Math.PI * 2);
        ctx.arc(cx + 25*scale, cy - 10*scale, 25*scale, 0, Math.PI * 2);
        ctx.arc(cx + 50*scale, cy, 20*scale, 0, Math.PI * 2);
        ctx.arc(cx + 25*scale, cy + 10*scale, 20*scale, 0, Math.PI * 2);
        ctx.fill();
        
        // Light blue shadow at bottom of cloud
        ctx.fillStyle = 'rgba(186, 230, 253, 0.5)';
        ctx.beginPath();
        ctx.arc(cx + 25*scale, cy + 12*scale, 18*scale, 0, Math.PI);
        ctx.fill();
    }
    drawCloud(80, 100, 1.2);
    drawCloud(400, 60, 1.5);
    drawCloud(650, 120, 1);

    // Big Yellow Textured Hills (Distant)
    ctx.fillStyle = '#fde047'; // Yellow
    ctx.beginPath();
    ctx.arc(150, canvas.height - 50, 180, Math.PI, 0);
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#facc15'; // Darker yellow pattern lines
    // Simple criss-cross pattern illusion
    for(let i=0; i<300; i+=30) {
        ctx.beginPath(); ctx.moveTo(0+i, canvas.height-50); ctx.lineTo(150, canvas.height-230); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(300-i, canvas.height-50); ctx.lineTo(150, canvas.height-230); ctx.stroke();
    }

    ctx.fillStyle = '#fde047';
    ctx.beginPath();
    ctx.arc(600, canvas.height - 50, 140, Math.PI, 0);
    ctx.fill();

    // Bushy Green Hills (Midground)
    const drawBush = (cx, cy, radius) => {
        ctx.fillStyle = '#16a34a'; // Dark green border/shadow
        ctx.beginPath(); ctx.arc(cx, cy, radius+4, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#22c55e'; // Bright green main
        ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#4ade80'; // Light green highlight
        ctx.beginPath(); ctx.arc(cx-radius/3, cy-radius/3, radius/2, 0, Math.PI*2); ctx.fill();
    }
    
    // Bush cluster left
    drawBush(50, canvas.height - 80, 40);
    drawBush(100, canvas.height - 100, 50);
    drawBush(160, canvas.height - 70, 35);

    // Bush cluster right
    drawBush(500, canvas.height - 90, 45);
    drawBush(560, canvas.height - 110, 55);
    drawBush(630, canvas.height - 80, 40);
    drawBush(700, canvas.height - 60, 30);
}

const UI = {
    startScreen: document.getElementById('startScreen'),
    quizScreen: document.getElementById('quizScreen'),
    gameOverScreen: document.getElementById('gameOverScreen'),

    leaderboardList: document.getElementById('leaderboardList')
};

// --- UTILITY FUNCTIONS ---
function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

function updateHUD() {
    document.getElementById('hudName').innerText = playerName;
    document.getElementById('hudScore').innerText = score;
    document.getElementById('hudLevel').innerText = currentLevel;
}

function startGame() {
    const nameInput = UI.playerNameInput.value.trim();
    if (!nameInput) {
        UI.playerNameInput.style.borderColor = 'red';
        setTimeout(() => UI.playerNameInput.style.borderColor = '', 1000);
        return;
    }
    
    playerName = nameInput.toUpperCase();
    score = 0;
    currentLevel = 1;
    
    UI.startScreen.classList.add('hidden');
    UI.gameOverScreen.classList.add('hidden');
    UI.gameHUD.classList.remove('hidden');
    UI.touchControls.classList.remove('hidden'); // Show on mobile

    gameState = 'PLAYING';
    loadLevel(currentLevel);
    updateHUD();
    
    if(!animationId) gameLoop();
}

function triggerQuiz() {
    gameState = 'QUIZ';
    keys.ArrowLeft = keys.ArrowRight = keys.ArrowUp = false; // reset inputs
    UI.quizScreen.classList.remove('hidden');
    
    // Get questions for this level from Question Bank
    let normalQuestions = [...questionBank[currentLevel].normal];
    let kbatQuestions = [...questionBank[currentLevel].kbat];
    
    // Shuffle the question pools
    shuffleArray(normalQuestions);
    shuffleArray(kbatQuestions);
    
    // Pick 2 Normal and 1 KBAT/HOTS question
    currentQuizQuestions = [normalQuestions[0], normalQuestions[1], kbatQuestions[0]];
    
    // Shuffle the final 3 questions so KBAT isn't always the last question
    shuffleArray(currentQuizQuestions);

    currentQuestionIndex = 0;
    
    document.getElementById('quizLevelDisplay').innerText = currentLevel;
    loadQuestion();
}

function loadQuestion() {
    document.getElementById('questionCounter').innerText = currentQuestionIndex + 1;
    const q = currentQuizQuestions[currentQuestionIndex];
    
    document.getElementById('questionText').innerText = q.q;
    
    const container = document.getElementById('optionsContainer');
    container.innerHTML = '';
    
    q.options.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.className = "w-full p-4 text-left border-2 border-blue-300 rounded-lg bg-blue-100 hover:bg-blue-200 hover:border-blue-500 font-semibold text-blue-900 transition-colors";
        btn.innerText = opt;
        btn.onclick = () => handleAnswer(index, btn);
        container.appendChild(btn);
    });
    
    document.getElementById('quizFeedback').classList.add('hidden');
}

function handleAnswer(selectedIndex, btnElement) {
    const container = document.getElementById('optionsContainer');
    // Disable all buttons
    Array.from(container.children).forEach(b => b.disabled = true);
    
    const q = currentQuizQuestions[currentQuestionIndex];
    const feedback = document.getElementById('quizFeedback');
    feedback.classList.remove('hidden');
    
    if (selectedIndex === q.answer) {
        btnElement.classList.remove('bg-blue-100', 'border-blue-300', 'text-blue-900');
        btnElement.classList.add('bg-green-500', 'text-white', 'border-green-600');
        feedback.innerText = "Correct! +100 Points";
        feedback.className = "mt-4 text-center font-bold text-xl text-green-500";
        score += 100;
    } else {
        btnElement.classList.remove('bg-blue-100', 'border-blue-300', 'text-blue-900');
        btnElement.classList.add('bg-red-500', 'text-white', 'border-red-600');
        // Highlight correct answer
        container.children[q.answer].classList.remove('bg-blue-100');
        container.children[q.answer].classList.add('bg-green-300', 'border-green-500');
        
        feedback.innerText = "Incorrect!";
        feedback.className = "mt-4 text-center font-bold text-xl text-red-500";
    }
    
    updateHUD();
    
    setTimeout(() => {
        currentQuestionIndex++;
        if (currentQuestionIndex < 3) {
            loadQuestion();
        } else {
            endQuizSequence();
        }
    }, 1500);
}

function endQuizSequence() {
    UI.quizScreen.classList.add('hidden');
    
    currentLevel++;
    if (currentLevel > maxLevel) {
        triggerGameOver();
    } else {
        gameState = 'PLAYING';
        loadLevel(currentLevel);
        updateHUD();
    }
}

function triggerGameOver() {
    gameState = 'GAMEOVER';
    UI.gameHUD.classList.add('hidden');
    UI.touchControls.classList.add('hidden');
    UI.gameOverScreen.classList.remove('hidden');
    
    document.getElementById('finalName').innerText = playerName;
    document.getElementById('finalScore').innerText = score;
    
    saveToLeaderboard(playerName, score);
}

// --- 7. LEADERBOARD ---
function saveToLeaderboard(name, sc) {
    leaderboardData.push({ name: name, score: sc });
    // Sort descending
    leaderboardData.sort((a, b) => b.score - a.score);
    // Keep top 10
    if (leaderboardData.length > 10) leaderboardData.length = 10;
    
    renderLeaderboard();
}

function renderLeaderboard() {
    UI.leaderboardList.innerHTML = '';
    if (leaderboardData.length === 0) {
        UI.leaderboardList.innerHTML = '<li class="text-gray-500 text-center text-sm mt-4 italic">No records yet. Be the first!</li>';
        return;
    }
    
    leaderboardData.forEach((entry, index) => {
        const li = document.createElement('li');
        li.className = "flex justify-between items-center bg-gray-700 p-3 rounded-lg shadow-sm";
        
        let rankStyling = "text-gray-400";
        let trophy = "";
        if (index === 0) { rankStyling = "text-yellow-400 font-bold"; trophy = "🏆"; }
        else if (index === 1) { rankStyling = "text-gray-300 font-bold"; trophy = "🥈"; }
        else if (index === 2) { rankStyling = "text-yellow-600 font-bold"; trophy = "🥉"; }

        li.innerHTML = `
            <div class="flex items-center gap-3">
                <span class="${rankStyling} w-6 text-center">${index + 1}</span>
                <span class="text-white font-semibold">${entry.name} ${trophy}</span>
            </div>
            <span class="text-blue-400 font-bold pixel-font text-xs">${entry.score}</span>
        `;
        UI.leaderboardList.appendChild(li);
    });
}

// --- 8. INPUT LISTENERS ---
window.addEventListener('keydown', (e) => {
    if (keys.hasOwnProperty(e.code)) keys[e.code] = true;
    if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
    
    // Prevent scrolling with arrows/space
    if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.code) > -1) {
        e.preventDefault();
    }
});

window.addEventListener('keyup', (e) => {
    if (keys.hasOwnProperty(e.code)) keys[e.code] = false;
    if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
});

// Touch Controls
function setupTouchControls() {
    const btnLeft = document.getElementById('btnLeft');
    const btnRight = document.getElementById('btnRight');
    const btnJump = document.getElementById('btnJump');

    const handleTouchStart = (key) => (e) => { e.preventDefault(); keys[key] = true; };
    const handleTouchEnd = (key) => (e) => { e.preventDefault(); keys[key] = false; };

    btnLeft.addEventListener('touchstart', handleTouchStart('ArrowLeft'));
    btnLeft.addEventListener('touchend', handleTouchEnd('ArrowLeft'));
    
    btnRight.addEventListener('touchstart', handleTouchStart('ArrowRight'));
    btnRight.addEventListener('touchend', handleTouchEnd('ArrowRight'));
    
    btnJump.addEventListener('touchstart', handleTouchStart('ArrowUp'));
    btnJump.addEventListener('touchend', handleTouchEnd('ArrowUp'));
}

// Button Listeners
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', () => {
    UI.startScreen.classList.remove('hidden');
    UI.gameOverScreen.classList.add('hidden');
    UI.playerNameInput.value = '';
    UI.playerNameInput.focus();
});

// Setup Initialization
setupTouchControls();
renderLeaderboard(); // initial empty state
UI.playerNameInput.focus();

// Initial background draw for start screen effect
ctx.fillStyle = '#87CEEB';
ctx.fillRect(0,0,canvas.width, canvas.height);
drawBackground();
